name: ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose config
        run: docker compose config --quiet

  build:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
        with:
          path: release

      - uses: actions/checkout@v4
        with:
          repository: MasonicLounge/MasonicCore
          path: backend

      - uses: actions/checkout@v4
        with:
          repository: MasonicLounge/MasonicSkin
          path: frontend

      - uses: docker/setup-buildx-action@v3

      - name: Build images
        working-directory: release
        run: docker compose build api web